# Put every merge to main live on finch.hughesnode.com.
#
# 1. Check that the app typechecks and builds, so a broken change never
#    reaches the server.
# 2. SSH into the VPS and run scripts/deploy.sh there, which pulls main,
#    rebuilds, and restarts Finch.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions).
# docs/deploy.md has the one-time setup:
#   VPS_HOST      the server's address
#   VPS_USER      the user that owns the Finch checkout
#   VPS_SSH_KEY   a private key whose public half is in that user's authorized_keys
#   VPS_APP_DIR   the path of the Finch checkout on the server
#
# Until the secrets exist, the deploy step is skipped and only the check runs.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST is not set, so nothing is deployed. See docs/deploy.md." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" "cd '$VPS_APP_DIR' && ./scripts/deploy.sh"
